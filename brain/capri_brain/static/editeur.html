<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visage de Capri</title>
<style>
  :root {
    --bg: #0a0910; --panel: #12101a; --line: #2a2436; --text: #e9e6f0; --muted: #8b849a;
    --crimson: #e8274f; --green: #3dffa0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 700 16px "Cascadia Mono", Consolas, monospace; letter-spacing: .2em; color: var(--crimson); }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  button { background: none; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--crimson); }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  #preview, #body { width: 100%; display: block; border-radius: 12px; margin-bottom: 12px; }
  #gestures { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #gestures button { padding: 4px 10px; font-size: 13px; }
  #gestures button.on { border-color: var(--green); color: var(--green); }
  .sticky { max-height: calc(100vh - 90px); overflow-y: auto; }
  .sticky { position: sticky; top: 16px; align-self: start; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; padding: 8px 12px 10px; background: var(--panel); }
  legend { color: var(--green); font-weight: 600; padding: 0 6px; }
  label { display: grid; grid-template-columns: 1fr 1.2fr 44px; align-items: center; gap: 8px; padding: 3px 0; color: var(--muted); }
  label:has(input[type=color]) { grid-template-columns: 1fr auto; }
  input[type=range] { width: 100%; accent-color: var(--crimson); }
  input[type=color] { width: 44px; height: 26px; border: 1px solid var(--line); background: none; padding: 0; border-radius: 6px; }
  output { font: 12px "Cascadia Mono", Consolas, monospace; color: var(--text); text-align: right; }
</style>
</head>
<body>
<header>
  <h1>VISAGE</h1>
  <button id="reset" title="Revenir aux réglages d'origine">Réinitialiser</button>
  <span id="status">chargement…</span>
</header>
<main>
  <div class="sticky">
    <div id="gestures"></div>
    <canvas id="body"></canvas>
    <canvas id="preview"></canvas>
  </div>
  <div id="controls"></div>
</main>
<script src="/hub-i18n.js"></script>
<script src="editeur.js"></script>
</body>
</html>
