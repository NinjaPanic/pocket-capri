# Configuration du cerveau de Capri.
# Relance start-capri.bat après une modification.

[server]
# 127.0.0.1 = accessible uniquement depuis ce PC.
# Pour le téléphone plus tard (via Tailscale), on mettra "0.0.0.0".
host = "127.0.0.1"
port = 8765

[llm]
# "ollama" = 100 % local et gratuit.
# Ou un service en ligne (clé API à mettre dans le hub, Réglages > Cerveau) :
# "groq", "google", "openai", "anthropic", "xai", "mistral", "openrouter", "deepseek".
provider = "ollama"
temperature = 0.65
max_tokens = 700

[llm.ollama]
url = "http://127.0.0.1:11434"
# qwen3-vl voit les images (captures d'écran) en plus de parler.
model = "qwen3-vl:8b-instruct"
num_ctx = 8192
# Garde le modèle chargé en mémoire GPU pendant ce temps d'inactivité.
# (avant : "30m" ; le recharger coûte 6 à 9 s sur ta première phrase. Il est aussi rechargé
#  d'avance quand tu reviens devant le PC, et tout s'éteint quand tu quittes Capri.)
keep_alive = "4h"

# Échantillonnage (essais du 31/10 sur la batterie de conversations, tools/test_conversation.py) : les réglages
# recommandés par Qwen (top_p 0.8, top_k 20, repeat_penalty 1.0, presence_penalty 1.5) n'ont pas fait mieux que les
# nôtres (plus de « Et puis… »). Pour en essayer d'autres, décommente et ajuste :
# [llm.ollama.sampling]
# top_p = 0.8
# top_k = 20
# repeat_penalty = 1.0
# presence_penalty = 1.5

[llm.groq]
# Clé gratuite sur https://console.groq.com/keys
# Tu peux aussi la mettre dans la variable d'environnement GROQ_API_KEY.
api_key = ""
model = "llama-3.3-70b-versatile"

[voice]
enabled = true
# true = elle ne réagit que si tu dis « Capri » (ou juste après qu'elle t'a répondu).
wake_word = true
# Secondes après sa réponse pendant lesquelles tu peux lui répondre sans dire son nom.
follow_up_seconds = 8
# Silence (en secondes) qui marque la fin de ta phrase. Plus court = plus réactif.
end_silence = 0.6
# Si ta phrase s'arrête au milieu d'une idée (« et… », « parce que… », « euh »), elle attend jusqu'à ça.
end_silence_long = 1.3
# Dès ce court silence, ta phrase part en transcription « au cas où » : le texte est prêt à la fin du silence.
pre_transcribe_silence = 0.28
# Tu peux lui couper la parole sans dire « Capri » (sa voix baisse dès que tu parles, s'arrête si c'est toi).
barge_in = true
stt_model = "large-v3-turbo"
# "edge" = voix naturelle de Microsoft (gratuite, sans clé, en ligne) ; "kokoro" = voix locale (hors ligne, plus robotique).
tts_engine = "edge"
tts_natural_voice = "fr-FR-VivienneMultilingualNeural"
tts_voice = "ff_siwis"
tts_speed = 1.05

[personnalite]
# 0 = douce, 1 = piquante. Elle lit ça dans son contexte.
sarcasme = 0.5
# 0 = jamais jalouse, 1 = très possessive (scènes quand tu regardes autre chose, quand tu joues sans elle).
jalousie = 0.4

[memory]
# Modèle d'embeddings (toujours local, via Ollama), utilisé pour retrouver les souvenirs.
embed_model = "nomic-embed-text"
# Nombre de souvenirs rappelés à chaque message.
recall = 6
# Nombre d'échanges récents gardés dans la conversation.
history_turns = 12

[vie]
# Elle remarque ton retour quand tu as été absent au moins ce temps (minutes).
accueil = true
absence_minutes = 20
# Elle te lance une petite phrase d'elle-même après ce temps sans vous parler (minutes, 0 = jamais),
# seulement entre ces heures, jamais pendant un jeu en plein écran.
spontane_minutes = 8
spontane_heures = [9, 23]
# Bavarde : 0 = discrète (elle vient rarement), 0.5 = équilibré, 1 = elle parle tout le temps, comme quelqu'un à côté
# de toi. Quand elle n'a rien à dire, elle retourne à ses activités à elle.
bavardage = 0.5
# Elle réagit à ce qui se passe sur le PC (jeu lancé ou fermé, réseau, clé USB, processeur qui chauffe,
# batterie, longue session) : un geste et une bulle, et quelques mots seulement quand ça compte.
reactions_pc = true
# Pendant un jeu, son modèle quitte la carte graphique (~6 Go rendus au jeu) et revient à la fin du jeu.
liberer_gpu_en_jeu = true
# Sa curiosité : elle explore d'elle-même des sujets sur Wikipédia (lecture seule) et t'en parle.
curiosite = true
curiosite_par_jour = 3
# Ses heures « de nuit » : voix plus basse, gestes calmes, pas d'effets lumineux.
nuit = [23, 7]
